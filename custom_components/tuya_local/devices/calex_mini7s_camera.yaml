name: Camera
products:
  - id: ahpgd4ptfekaer6k
    manufacturer: Calex
    model: Mini7S
entities:
  - entity: switch
    translation_key: camera_record
    dps:
      - id: 150
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: true
  - entity: select
    translation_key: recording_mode
    category: config
    dps:
      - id: 151
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "1"
            value: event
          - dps_val: "2"
            value: continuous
          - dps_val: null
            value: continuous
  - entity: switch
    translation_key: motion_detection
    dps:
      - id: 134
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: false
  - entity: event
    class: motion
    dps:
      - id: 115
        type: base64
        name: event
        optional: true
        mapping:
          - dps_val: null
            value: null
          - value: detected
      - id: 115
        type: base64
        name: snapshot
        optional: true
        sensitive: true
  - entity: select
    translation_key: night_vision
    category: config
    dps:
      - id: 108
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "0"
            value: auto
          - dps_val: "1"
            value: "off"
          - dps_val: "2"
            value: "on"
          - dps_val: null
            value: auto
  - entity: select
    translation_key: motion_sensitivity
    category: config
    dps:
      - id: 106
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "0"
            value: low
          - dps_val: "1"
            value: medium
          - dps_val: "2"
            value: high
          - dps_val: null
            value: low
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 139
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: false
  - entity: select
    name: Sound sensitivity
    icon: "mdi:volume-high"
    category: config
    dps:
      - id: 140
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "0"
            value: low
          - dps_val: "1"
            value: high
          - dps_val: null
            value: low
  - entity: event
    name: Sound
    category: config
    dps:
      - id: 141
        type: string
        name: event
        optional: true
        mapping:
          - dps_val: ""
            value: null
          - value: detected
      - id: 141
        type: string
        name: message
        optional: true
  - entity: switch
    translation_key: watermark
    category: config
    dps:
      - id: 104
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: false
  - entity: switch
    translation_key: flip_image
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: false
            hidden: true
  - entity: light
    translation_key: indicator
    category: config
    dps:
      - id: 101
        type: boolean
        name: switch
        optional: true
        mapping:
          - dps_val: null
            value: false
  - entity: sensor
    class: enum
    translation_key: sd_status
    category: diagnostic
    dps:
      - id: 110
        type: integer
        name: sensor
        optional: true
        mapping:
          - dps_val: 1
            value: normal
          - dps_val: 2
            value: fault
          - dps_val: 3
            value: full
          - dps_val: 4
            value: formatting
          - dps_val: 5
            value: missing
          - dps_val: null
            value: normal
      - id: 109
        type: string
        name: capacity
        optional: true
  - entity: button
    name: Format SD card
    icon: "mdi:sd"
    category: config
    dps:
      - id: 111
        type: boolean
        name: button
        optional: true
      - id: 117
        type: integer
        name: sd_format_status
        optional: true
        mapping:
          - dps_val: -2000
            value: Formatting
          - dps_val: -2001
            value: Format error
          - dps_val: -2002
            value: "No SD card"
          - dps_val: -2003
            value: Card error
